{% load static %}
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">AI</div>
      <div class="title">
        <strong>Pothole Vision</strong>
        <span>Giám sát hạ tầng</span>
      </div>
    </div>

    <nav class="menu" id="menu">
      <a href="{% url 'dashboard' %}" data-route="dashboard">
        <span aria-hidden="true">🏠</span>
        <span>Tổng quan</span>
        <span class="badge">Live</span>
      </a>
      <a href="{% url 'live_detection' %}" data-route="live">
        <span aria-hidden="true">🎥</span>
        <span>Chạy trực tiếp</span>
        <span class="badge" style="background: rgba(126,234,130,.18)">Realtime</span>
      </a>
      <a href="{% url 'map' %}" data-route="map">
        <span aria-hidden="true">🗺️</span>
        <span>Map</span>
        <span class="badge">GPS</span>
      </a>
      <a href="{% url 'history' %}" data-route="history">
        <span aria-hidden="true">🕘</span>
        <span>Lịch sử</span>
        <span class="badge">Logs</span>
      </a>
      {% if request.user.is_superuser %}
        <a href="{% url 'account_list' %}" data-route="account">
          <span aria-hidden="true">👤</span>
          <span>Quản lí tài khoản</span>
          <span class="badge">User</span>
        </a>
      {% endif %}
      <a href="{% url 'signout' %}" data-route="signout">
        <span aria-hidden="true">🚪</span>
        <span>Đăng xuất</span>
      </a>
    </nav>

    <div class="bottom">
      <div class="toggle">
        <span>Chế độ sáng/tối</span>
        <button id="themeToggle" type="button">🌗</button>
      </div>
    </div>
  </aside>
</div>
<script>
  // Theme persistence
  const root = document.documentElement
  const saved = localStorage.getItem('theme')
  if (saved) root.setAttribute('data-theme', saved)
  
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
    root.setAttribute('data-theme', next)
    localStorage.setItem('theme', next)
  })
  
  // Active state demo
  document.querySelectorAll('#menu a').forEach((a) => {
    a.addEventListener('click', (e) => {
      document.querySelectorAll('#menu a').forEach((el) => el.classList.remove('active'))
      a.classList.add('active')
    })
  })
  document.addEventListener('DOMContentLoaded', function () {
    const links = document.querySelectorAll('#menu a')
    const currentUrl = window.location.pathname
  
    links.forEach((link) => {
      // Bỏ class active cũ
      link.classList.remove('active')
  
      // So sánh URL hiện tại với href trong menu
      if (link.getAttribute('href') === currentUrl) {
        link.classList.add('active')
      }
  
      // Nếu bạn vẫn muốn đổi active khi click (không reload trang)
      link.addEventListener('click', function () {
        links.forEach((l) => l.classList.remove('active'))
        this.classList.add('active')
      })
    })
  })
</script>
