{% load static %}
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chạy trực tiếp</title>
    <link rel="stylesheet" href="{% static 'my_app/css/live_detection.css' %}" />
    <link rel="stylesheet" href="{% static 'my_app/css/sidebar.css' %}" />
    <style>
      .video-container {
        position: relative;
        display: inline-block;
      }
      #cameraFeed {
        display: block;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body data-theme="light">
    <!-- Sidebar -->
    <aside class="sidebar">
      {% include 'my_app/menu.html' %}
    </aside>

    <!-- Main -->
    <main>
      <div class="tmp">
        <div class="video-container">
          <video id="cameraFeed" autoplay muted></video>
          <canvas id="overlay"></canvas>
        </div>
        <div class="info-panel">
          <h3>Thông tin phát hiện</h3>
          <div class="info-item">
            Số ổ gà: <span id="pothole-count">0</span>
          </div>
          <div class="info-item">
            Độ chính xác trung bình: <span id="confidence">-</span>
          </div>
          <div class="info-item">
            GPS: <span id="gps-status">Chưa bật</span>
            <button class="btn btn-gps" id="gpsToggle" onclick="toggleGPS()">📍 Bật GPS</button>
          </div>
          <div class="info-item">
            Camera: <span id="camera-status">Chưa bật</span>
            <button type="button" class="btn btn-camera" id="cameraToggle" onclick="toggleCamera()">📷 Bật Camera</button>
          </div>
        </div>
      </div>
      <!-- IMAGE UPLOAD -->
      <div class="box">
        <h3>🖼️ Upload Ảnh</h3>
        <form id="uploadForm" enctype="multipart/form-data">
          <input type="file" name="image" accept="image/*" />
          <button type="submit">Submit</button>
        </form>
        <div id="result" class="container"></div>
      </div>
    </main>

    <!-- Thông báo -->
    {% if messages %}
      <div style="position:fixed; top:20px; right:20px; z-index:9999;">
        {% for message in messages %}
          <div style="background-color:
            {% if 'error' in message.tags %}
              
              
              
               #e74c3c



            {% elif 'success' in message.tags %}
              
              
              
               #2ecc71



            {% else %}
              
              
              
               #f39c12



            {% endif %};
            color:white; padding:12px 20px; border-radius:8px; margin-bottom:10px;
            animation: fadeInOut 4s forwards;">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <script src="{% static 'my_app/js/live_detection.js' %}"></script>
    <script>
      const detect_image = "{% url 'detect_image' %}"
    </script>
  </body>
</html>
