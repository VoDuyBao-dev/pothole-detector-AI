{% load static %}
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bản đồ ổ gà</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="{% static 'my_app/css/map.css' %}" />
    <link rel="stylesheet" href="{% static 'my_app/css/sidebar.css' %}" />
  </head>
  <body data-theme="light">
    <!-- Sidebar -->
    <aside class="sidebar">
      {% include 'my_app/menu.html' %}
    </aside>

    <!-- Map -->
    <div class="map-container">
      <div id="map"></div>
      <!-- GPS Info -->
      <div class="info-item">
        GPS: <span id="gps-status">Chưa bật</span>
        <button class="btn btn-gps" id="gpsToggle" onclick="toggleGPS()">📍 Bật GPS</button>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
      var map = L.map("map").setView([10.762622, 106.660172], 13); // default TP.HCM

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      {% for pothole in potholes %}
        var color = "{{ pothole.level }}" === "large" ? "red" : "blue";
        var marker = L.circleMarker(
          [{{ pothole.latitude }}, {{ pothole.longitude }}],
          {
            color: color,
            radius: 8,
            fillOpacity: 0.8,
          }
        ).addTo(map);

        marker.bindPopup(`
          <b>Ổ gà #{{ pothole.id }}</b><br>
          Loại: {{ pothole.level }}<br>
          Người phát hiện đầu tiên: {{ pothole.user }}<br>
          Confidence TB: {{ pothole.confidence_avg|floatformat:2 }}<br>
          Số lần phát hiện: {{ pothole.detections_count }}<br>
          Thời gian: {{ pothole.detected_at }}
        `);
      {% endfor %}

      // GPS toggle
      let isGPSActive = false;
      let gpsWatchId = null;
      let userMarker = null;   // giữ marker của user
      window.currentGPS = null;

      function toggleGPS() {
        const gpsButton = document.getElementById("gpsToggle");
        const gpsStatus = document.getElementById("gps-status");

        if (!isGPSActive) {
          if (navigator.geolocation) {
            gpsWatchId = navigator.geolocation.watchPosition(
              (pos) => {
                const { latitude, longitude } = pos.coords;
                window.currentGPS = { lat: latitude, lon: longitude };
                gpsStatus.innerText = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
                gpsStatus.className = "status-active";
                gpsButton.innerText = "📍 Tắt GPS";
                gpsButton.classList.add("btn-active");
                isGPSActive = true;

                // Nếu marker chưa có -> tạo mới
                if (!userMarker) {
                  userMarker = L.marker([latitude, longitude], {
                    title: "Vị trí của bạn",
                  }).addTo(map).bindPopup("📍 Bạn đang ở đây");
                  // chỉ setView lần đầu
                  map.setView([latitude, longitude], 15);
                } else {
                  // nếu đã có marker -> cập nhật vị trí
                  userMarker.setLatLng([latitude, longitude]);
                }
              },
              (err) => {
                window.currentGPS = null;
                gpsStatus.innerText = "Lỗi: " + err.message;
                gpsStatus.className = "status-inactive";
              },
              { enableHighAccuracy: true, maximumAge: 2000, timeout: 5000 }
            );
          } else {
            gpsStatus.innerText = "GPS không hỗ trợ";
            gpsStatus.className = "status-inactive";
          }
        } else {
          // Tắt GPS
          if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
          window.currentGPS = null;
          gpsStatus.innerText = "Đã tắt";
          gpsStatus.className = "status-inactive";
          gpsButton.innerText = "📍 Bật GPS";
          gpsButton.classList.remove("btn-active");
          isGPSActive = false;

          // Xóa marker khỏi map
          if (userMarker) {
            map.removeLayer(userMarker);
            userMarker = null;
          }
        }
      }
    </script>
  </body>
</html>
